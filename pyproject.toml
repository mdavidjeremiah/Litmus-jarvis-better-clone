[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "jarvis-ai"
version = "1.0.0"
description = "Offline-capable Jarvis AI assistant with voice, LLM, and automation"
authors = [{name = "JARVIS Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "PyAudio>=0.2.14",
    "ollama>=0.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]


[project.scripts]
jarvis = "jarvis.cli:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]
